<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Warm Luxury Gold Linear Gradient -->
    <linearGradient id="vanguardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Point-Topped Hexagon Frame -->
  <polygon
    points="300,20 542,160 542,440 300,580 58,440 58,160"
    fill="#0A0B0E"
    stroke="url(#vanguardGold)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Circuit Traces Group (Gold Circuit Lines) -->
  <g stroke="url(#vanguardGold)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Center Trace -->
    <line x1="300" y1="185" x2="300" y2="70" />

    <!-- Bottom Center Trace -->
    <line x1="300" y1="415" x2="300" y2="530" />

    <!-- Top-Left & Top-Right Flanks -->
    <polyline points="250,214 200,185 200,118" />
    <polyline points="350,214 400,185 400,118" />

    <!-- Upper-Side Zigzags -->
    <polyline points="200.4,280 150,280 150,185 102,185" />
    <polyline points="399.6,280 450,280 450,185 498,185" />

    <!-- Mid-Side Horizontal Traces -->
    <line x1="200.4" y1="310" x2="100" y2="310" />
    <line x1="399.6" y1="310" x2="500" y2="310" />

    <!-- Lower-Side Angled Traces -->
    <line x1="200.4" y1="345" x2="110" y2="412" />
    <line x1="399.6" y1="345" x2="490" y2="412" />

    <!-- Bottom-Left & Bottom-Right Flanks -->
    <polyline points="250,386 200,415 200,482" />
    <polyline points="350,386 400,415 400,482" />

    <!-- Isometric 3D Wireframe Cube -->
    <!-- Top Face (Rhombus) -->
    <polygon points="300,185 399.6,242.5 300,300 200.4,242.5" fill="#0A0B0E" />
    <!-- Left Face -->
    <polygon points="200.4,242.5 300,300 300,415 200.4,357.5" fill="#0A0B0E" />
    <!-- Right Face -->
    <polygon points="300,300 399.6,242.5 399.6,357.5 300,415" fill="#0A0B0E" />
  </g>

  <!-- Outer Ring Nodes & Cube Nodes (Circuit Terminals) -->
  <g stroke="url(#vanguardGold)" stroke-width="5.5" fill="#0A0B0E">
    <!-- Top & Bottom Center Nodes -->
    <circle cx="300" cy="70" r="13" />
    <circle cx="300" cy="530" r="13" />

    <!-- Top Flanks -->
    <circle cx="200" cy="118" r="12" />
    <circle cx="400" cy="118" r="12" />

    <!-- Upper Sides -->
    <circle cx="102" cy="185" r="12" />
    <circle cx="498" cy="185" r="12" />

    <!-- Mid Sides -->
    <circle cx="100" cy="310" r="12" />
    <circle cx="500" cy="310" r="12" />

    <!-- Lower Sides -->
    <circle cx="110" cy="412" r="12" />
    <circle cx="490" cy="412" r="12" />

    <!-- Bottom Flanks -->
    <circle cx="200" cy="482" r="12" />
    <circle cx="400" cy="482" r="12" />

    <!-- 7 Nodes on the Cube Wireframe -->
    <circle cx="300" cy="300" r="11" />
    <circle cx="300" cy="185" r="11" />
    <circle cx="300" cy="415" r="11" />
    <circle cx="200.4" cy="242.5" r="11" />
    <circle cx="399.6" cy="242.5" r="11" />
    <circle cx="200.4" cy="357.5" r="11" />
    <circle cx="399.6" cy="357.5" r="11" />
  </g>
</svg>