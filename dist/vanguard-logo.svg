<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold / Amber Linear Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Cyan Blue Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== TECH CHEVRON "V" MARK ==================== -->
  <g id="vanguard-symbol" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Top Vertical Trace with Node -->
    <line x1="250" y1="135" x2="250" y2="185" stroke="url(#cyanGrad)" stroke-width="4.5" />
    <circle cx="250" cy="135" r="4.5" fill="none" stroke="url(#cyanGrad)" stroke-width="4" />

    <!-- MAIN GOLD V - Outer Chevron -->
    <polyline
      points="155,120 250,252 345,120"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="7"
    />

    <!-- MAIN GOLD V - Inner Chevron -->
    <polyline
      points="185,145 250,232 315,145"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="5"
    />

    <!-- LEFT WING CIRCUIT TRACES -->
    <!-- Outermost Left Cyan Angled Line -->
    <polyline
      points="148,130 195,200"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
    <!-- Left Branch 1 with Node -->
    <polyline
      points="162,178 180,178 208,218"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
    <circle cx="166" cy="178" r="4" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" />

    <!-- Left Lower Diagonal with Node -->
    <polyline
      points="182,215 210,255"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
    <circle cx="209" cy="230" r="3.5" fill="none" stroke="url(#cyanGrad)" stroke-width="3" />

    <!-- RIGHT WING CIRCUIT TRACES -->
    <!-- Outermost Right Gold/Cyan Angled Segment -->
    <polyline
      points="305,200 352,130"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="4"
    />
    <!-- Right Branch 1 with Node -->
    <polyline
      points="292,218 320,178 338,178"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
    <circle cx="334" cy="178" r="4" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" />

    <!-- Right Lower Diagonal with Node -->
    <polyline
      points="290,255 318,215"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
    <circle cx="291" cy="230" r="3.5" fill="none" stroke="url(#cyanGrad)" stroke-width="3" />

    <!-- BOTTOM V-POINT EXTENSION & TERMINALS -->
    <polyline
      points="240,265 250,282 260,265"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4.5"
    />
    <line x1="250" y1="282" x2="250" y2="300" stroke="url(#cyanGrad)" stroke-width="4.5" />
    <polyline
      points="267,260 267,280"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
    <polyline
      points="233,260 233,275"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="4"
    />
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <!-- "V A N G U A R D" -->
  <text
    x="250"
    y="360"
    text-anchor="middle"
    fill="url(#goldGrad)"
    font-family="'Roboto', 'Montserrat', 'Inter', -apple-system, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="14"
  >
    VANGUARD
  </text>

  <!-- CIRCUIT LINE WITH "S T U D I O" -->
  <g id="studio-circuit" stroke-linecap="round">
    <!-- Left Circuit Trace with Node -->
    <circle cx="95" cy="388" r="4" fill="none" stroke="url(#cyanGrad)" stroke-width="3" />
    <line x1="99" y1="388" x2="160" y2="388" stroke="url(#cyanGrad)" stroke-width="3.5" />

    <!-- "STUDIO" Text -->
    <text
      x="250"
      y="394"
      text-anchor="middle"
      fill="url(#cyanGrad)"
      font-family="'Roboto', 'Montserrat', 'Inter', -apple-system, sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="12"
    >
      STUDIO
    </text>

    <!-- Right Circuit Trace with Node -->
    <line x1="340" y1="388" x2="401" y2="388" stroke="url(#cyanGrad)" stroke-width="3.5" />
    <circle cx="405" cy="388" r="4" fill="none" stroke="url(#cyanGrad)" stroke-width="3" />
  </g>

  <!-- SUBTITLE "DIGITAL SOFTWARE AGENCY" -->
  <text
    x="250"
    y="426"
    text-anchor="middle"
    fill="#D97706"
    font-family="'Roboto', 'Montserrat', 'Inter', -apple-system, sans-serif"
    font-size="11.5"
    font-weight="600"
    letter-spacing="8"
  >
    DIGITAL SOFTWARE AGENCY
  </text>
</svg>
